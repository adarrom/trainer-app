    <style>
      :root {

      * { box-sizing: border-box; }
      /* Disable double-tap zoom without disabling pinch zoom or scrolling:
         touch-action: manipulation permits panning and pinch-zoom but
         removes the double-tap-to-zoom gesture (and the tap delay that
         came with it). The viewport meta above intentionally sets no
         scale cap and does not turn off user scaling, either of which
         would kill pinch zoom; double-tap is handled here instead.
         Applied on the page (html/body), on interactive elements, and on
         the board wrapper below. The board frame itself keeps the even
         stricter touch-action: none (see .board-frame), which also
         disables double-tap zoom there and is required so dragging a
         piece is delivered as pointer events instead of scrolling. */
      html, body { margin: 0; padding: 0; touch-action: manipulation; }
      button, [role="button"], a, select, summary, label, input { touch-action: manipulation; }
      .board-outer { touch-action: manipulation; }
      body {
        background: var(--room);
        color: var(--parchment);
        font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
        -webkit-tap-highlight-color: transparent;
        /* The status bar is translucent and the viewport is full-bleed, so
           without this the top of every view (back buttons, titles) slides
           underneath the clock / notch area and gets clipped. Reserve the
           system safe-area inset so content always starts below it. */
        padding-top: env(safe-area-inset-top, 0px);
      }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }

      .wrap { margin: 0 auto; width: 100%; max-width: 36rem; padding: 0 1rem; }

        background: var(--panel); border: 1px solid var(--border); padding: 0.75rem 1rem;

      }
      .line-row .main { min-width: 0; flex: 1; }

      .line-row .stat { margin: 0; font-size: 13px; color: var(--faded); }

      .plain-row .main { min-width: 0; flex: 1; }

      .tactics-btn { margin-top: 0.5rem; width: 100%; border-radius: 1rem; background: var(--panel); border: 1px solid var(--border); padding: 1rem 1.25rem; text-align: left; display: block; }

      .sess-head .titles { min-width: 0; flex: 1; }
      /* Session header text: full strength and fully shown. The kicker used
         to be the small gray --faded tone, single-line with an ellipsis, and
         the title was single-line too, so on the phone the course name read

      .sq .dot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 3; pointer-events: none; }
      .sq .dot i { width: 31%; height: 31%; border-radius: 50%; background: rgba(15,25,15,0.28); display: block; }

      .wrong-panel p { margin: 0; font-size: 0.9rem; line-height: 1.45; }
      .wrong-panel .correct-move { font-weight: 700; color: #ff9d97; }
      .try-again-btn { margin-top: 0.5rem; width: 100%; border-radius: 999px; background: var(--mistake); padding: 0.55rem 1.5rem; font-size: 1rem; font-weight: 700; color: #fff; }
      .premove-panel { margin-top: 0.375rem; border-radius: 0.75rem; background: rgba(62,142,247,0.12); border: 1px solid rgba(62,142,247,0.45); padding: 0.5rem 0.875rem; display: flex; align-items: center; gap: 0.625rem; }

      .end-panel .caption { margin: 0.5rem auto 0; max-width: 20rem; font-size: 0.8125rem; line-height: 1.45; color: var(--faded); }

         of this page it cached when it was first added, long after a newer
         build is on the server, so fixes "never arrive". On load (top-level
         window only; inside an embedding shell the shell handles freshness)
         fetch a fresh, uncached copy of this page, compare its build stamp
         with the one baked into the running copy, and if the server has a
         newer build, reload once from a cache-busting URL so the new copy
         actually replaces the cached one. The sessionStorage flag is only a
         reload-loop guard for this visit, not saved user data. */

        var STAMP = "v20261120-french-audit";
        try { if (window.self !== window.top) return; } catch (e) { return; }
        function check() {
          if (!window.fetch) return;
          fetch("index.html?__buildcheck=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.ok ? r.text() : ""; })
            .then(function (text) {
              if (!text) return;
              var m = text.match(/name="build-stamp" content="([^"]+)"/);
              if (!m || m[1] === STAMP) return;
              try {
                if (sessionStorage.getItem("trainer-build-check") === m[1]) return;
                sessionStorage.setItem("trainer-build-check", m[1]);
              } catch (e) {}
              var fresh = window.location.pathname + "?__fresh=" + Date.now() + window.location.hash;

            })
            .catch(function () {});
        }

        else window.addEventListener("load", check);
      })();

    <script>
      "use strict";
      /* ================================================================

            // button carrying the course progress, Next Line (N/M). On the
            // last line in training in the course it reads Finish (N/M);
            // an ended drill run keeps its End run label.
            const prog = !gaveUp ? courseLineProgress() : null;
            let nextIcon = "";
            if (prog && finishLabel !== "End run") {
              if (finishLabel === "Finish" && prog.n >= prog.m) finishLabel = "Finish (" + prog.n + "/" + prog.m + ")";
              else finishLabel = "Next Line (" + prog.n + "/" + prog.m + ")";
              nextIcon = '<svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5C6 4 9 3.6 12 5c3-1.4 6-1 8-.5v13c-2-.5-5-.9-8 .5-3-1.4-6-1-8-.5v-12z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 5v13" stroke="#fff" stroke-width="1.8"/></svg>';
            }
            const iconBg = gaveUp ? "var(--panel-2)" : clean ? "var(--good)" : "var(--accent)";
            const icon = gaveUp
              ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5C6 4 9 3.6 12 5c3-1.4 6-1 8-.5v13c-2-.5-5-.9-8 .5-3-1.4-6-1-8-.5v-12z" stroke="#f4f4f6" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 5v13" stroke="#f4f4f6" stroke-width="1.8"/></svg>'
              : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 12.5 L10 18 L19.5 6.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            const title = gaveUp ? "Solution shown" : quiz.kind === "puzzle" ? "Puzzle solved" : "Line complete";
            const caption = gaveUp
              ? "It will come back around in practice until it sticks."
              : clean
                ? (quiz.kind === "puzzle" ? "Solved clean. Nicely spotted." : "Clean run. Every move found, start to finish.")
                : "Finished with " + mistakes + " wrong move" + (mistakes === 1 ? "" : "s") + (hintedPlies.size ? " and " + hintedPlies.size + " hint" + (hintedPlies.size === 1 ? "" : "s") : "") + ". It comes back sooner so it sticks.";
            els.end.innerHTML =
              '<div class="end-panel fade-in">' +
                '<div class="row"><span class="icon" style="background:' + iconBg + '">' + icon + "</span><h3>" + title + "</h3></div>" +
                '<button type="button" class="next-btn" id="s-next">' + nextIcon + esc(finishLabel) + "</button>" +
                (mode !== "drill" && mode !== "time" ? '<button type="button" class="again-btn" id="s-again">Play it again</button>' : "") +
                '<p class="caption">' + esc(caption) + "</p>" +
              "</div>";
            els.end.querySelector("#s-next").addEventListener("click", () => { cleanup(); opts.onExit(); });
            const again = els.end.querySelector("#s-again");
            if (again) again.addEventListener("click", restart);
          } else {
            els.end.innerHTML = "";
          }

          // video note — follows the viewed position when browsing back
          const viewComment = viewPly > 0 && quiz.moves[viewPly - 1] ? quiz.moves[viewPly - 1].comment : "";
          const lastComment = viewComment;
          let noteHTML = "";
          if ((mode === "learn" || done) && (lastComment || (done && quiz.endNote && !browsing))) {
            noteHTML = '<div class="note-card fade-in">';
            if (mode === "learn" && lastComment && viewPly > 0) noteHTML += '<p><span class="san">' + esc(quiz.moves[viewPly - 1].san) + "</span>" + esc(lastComment) + "</p>";
            else if (done && lastComment && viewPly > 0 && mode !== "learn") noteHTML += '<p><span class="san">' + esc(quiz.moves[viewPly - 1].san) + "</span>" + esc(lastComment) + "</p>";
            if (done && quiz.endNote && !browsing) noteHTML += "<p>" + esc(quiz.endNote) + "</p>";
            noteHTML += "</div>";
          }
          els.note.innerHTML = noteHTML;

          // moves played
          const played = quiz.moves.slice(0, ply);
          if (played.length) {
            els.moves.innerHTML = played.map((m, i) => {
              const isUser = turnAt(i) === quiz.userColor;
              const num = i % 2 === 0 ? Math.floor(i / 2) + 1 + ". " : "";
              const prefix = startTurn === "black" && i === 0 ? "… " : num;
              const isViewed = browsing && i === viewPly - 1;
              const style = isViewed ? ' style="text-decoration:underline;text-underline-offset:3px"' : "";
              return '<span class="' + (isUser ? "mine" : "") + '"' + style + ">" + esc(prefix + m.san) + " </span>";
            }).join("");
          } else els.moves.innerHTML = "";

          // controls
          if (!done) {
            const canPlay = userTurn() && !browsing && !wrongAttempt && !premove;
            let c = '<button type="button" class="ctl-btn" id="s-hint"' + (canPlay ? "" : " disabled") + ">Hint</button>";
            if (mode === "learn") c += '<button type="button" class="ctl-btn" id="s-show"' + (canPlay ? "" : " disabled") + ">Show move</button>";
            if (mode !== "drill" && mode !== "time") c += '<button type="button" class="ctl-btn" id="s-restart">Restart</button>';
            if (quiz.kind === "puzzle") c += '<button type="button" class="ctl-btn giveup" id="s-giveup">Give up</button>';
            els.controls.innerHTML = c;
            els.controls.querySelector("#s-hint").addEventListener("click", useHint);
            const show = els.controls.querySelector("#s-show"); if (show) show.addEventListener("click", showMove);
            const rst = els.controls.querySelector("#s-restart"); if (rst) rst.addEventListener("click", restart);
            const gu = els.controls.querySelector("#s-giveup"); if (gu) gu.addEventListener("click", giveUp);
          } else {
            els.controls.innerHTML = "";
          }

          // overflow menu
          if (els.menupop) {
            if (menuOpen) {
              els.menupop.innerHTML =
                '<button type="button" class="menu-backdrop" id="s-menubg" aria-hidden="true" tabindex="-1"></button>' +
                '<div class="menu-pop fade-in" role="menu" aria-label="Line options">' +
                  (opts.onArchive ? '<button type="button" role="menuitem" id="s-arch">Archive line</button>' : "") +
                  (opts.onDelete ? '<button type="button" role="menuitem" class="danger" id="s-del">Delete line</button>' : "") +
                "</div>";
              els.menupop.querySelector("#s-menubg").addEventListener("click", () => { menuOpen = false; render(); });
              const ab = els.menupop.querySelector("#s-arch");
              if (ab) ab.addEventListener("click", () => { menuOpen = false; cleanup(); opts.onArchive(); });
              const db = els.menupop.querySelector("#s-del");
              if (db) db.addEventListener("click", () => { menuOpen = false; cleanup(); opts.onDelete(); });
            } else els.menupop.innerHTML = "";
          }
        }

        function cleanup() {
          alive = false;
          if (autoTimer) clearTimeout(autoTimer);
          if (premoveTimer) clearTimeout(premoveTimer);
          if (sessionCleanup === cleanup) sessionCleanup = null;
        }
        sessionCleanup = cleanup;

        root.querySelector("#s-quit").addEventListener("click", () => { cleanup(); opts.onQuit(); });
        const menuBtn = root.querySelector("#s-menu");
        if (menuBtn) menuBtn.addEventListener("click", () => { menuOpen = !menuOpen; render(); });

        render();
        scheduleAuto();
        if (finished() && !done) finish(mistakes, false);
        return { cleanup, forceEnd: () => { if (!done) { cleanup(); } }, isDone: () => done, refresh: render };
      }
    </script>
    <script>
      "use strict";
      /* ---------------- App shell: home, course page, runs ---------------- */
      const app = document.getElementById("app");
      let confirmReset = false;

      function stopSession() { if (sessionCleanup) sessionCleanup(); }

      function miniBoardHTML(course) {
        const firstLine = course.lines[0];
        const fen = firstLine && firstLine.moves.length ? firstLine.moves[firstLine.moves.length - 1].fen : START_FEN;
        const pieces = parseFen(fen);
        let cells = "";
        for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) {
          const file = course.color === "white" ? col : 7 - col;
          const rank = course.color === "white" ? 8 - row : row + 1;
          const sq = FILES[file] + rank;
          const piece = pieces.get(sq);
          const light = (row + col) % 2 === 0;
          cells += '<span class="cell" style="background:' + (light ? "var(--sq-light)" : "var(--sq-dark)") + '">' + (piece ? "<span>" + pieceSVG(piece.type, piece.color) + "</span>" : "") + "</span>";
        }
        return '<span class="mini-board" aria-hidden="true">' + cells + "</span>";
      }

      function dueLinesAll() {
        const now = Date.now();
        const out = [];
        for (const course of visibleCourses()) for (const line of course.lines) {
          const row = lineProgress.get(line.id);
          if (row && row.status === "learned" && row.dueAt <= now) out.push({ course, line });
        }
        out.sort((a, b) => (lineProgress.get(a.line.id).dueAt || 0) - (lineProgress.get(b.line.id).dueAt || 0));
        return out;
      }

      function renderHome() {
        stopSession();
        const now = Date.now();
        const vc = visibleCourses();
        const due = dueLinesAll();
        const puzzlesSolved = ALL_PUZZLES.filter((p) => (puzzleProgress.get(p.key) || {}).solved > 0).length;
        let nextDue = null;
        for (const row of lineProgress.values()) if (row.status === "learned" && row.dueAt > now && (!nextDue || row.dueAt < nextDue.dueAt)) nextDue = row;

        let html = '<div class="wrap fade-in" style="padding-top:0.25rem">';
        if (due.length > 0) {
          html += '<button type="button" class="cta" id="h-practice"><span class="cta-big">Practice: ' + due.length + " line" + (due.length === 1 ? "" : "s") + ' due</span><span class="cta-small">Spaced repetition picked these before you forget them.</span></button>';
        } else {
          html += '<div class="panel-card notice"><p>' + (lineProgress.size === 0 ? "Nothing due. Learn your first line below." : "All caught up. Nothing is due right now.") + "</p>" +
            (nextDue ? '<p class="sub">Next review ' + esc(dueLabel(nextDue.dueAt, now).toLowerCase()) + ".</p>" : "") + "</div>";
        }
        html += '<div class="course-list">';
        for (const course of vc) {
          const learned = course.lines.filter((l) => (lineProgress.get(l.id) || {}).status === "learned").length;
          const dueC = course.lines.filter((l) => { const r = lineProgress.get(l.id); return r && r.status === "learned" && r.dueAt <= now; }).length;
          const solved = course.puzzles.filter((p) => (puzzleProgress.get(p.key) || {}).solved > 0).length;
          html += '<button type="button" class="course-card" data-course="' + course.id + '" aria-label="Open ' + esc(course.name) + '">' +
            '<span class="top">' + miniBoardHTML(course) + '<span class="meta">' +
              '<span class="playas">Play as ' + course.color + (dueC > 0 ? '<span class="due-pill">' + dueC + " due</span>" : "") + "</span>" +
              '<span class="name">' + esc(course.name) + "</span>" +
              '<span class="source">' + esc(course.source) + "</span>" +
            "</span></span>" +
            '<span class="segments" aria-hidden="true">' + course.lines.map((l) => '<span class="' + ((lineProgress.get(l.id) || {}).status === "learned" ? "on" : "") + '"></span>').join("") + "</span>" +
            '<span class="counts">' + learned + " of " + course.lines.length + " lines learned · " + solved + " of " + course.puzzles.length + " tactics solved</span>" +
          "</button>";
        }
        html += "</div>";
        html += '<h2 class="section-title">Other ways to train</h2><div class="mode-grid">' +
          '<button type="button" class="mode-btn" id="h-puzzles"><span class="t">Puzzles</span><span class="d">' + puzzlesSolved + "/" + ALL_PUZZLES.length + ' tactics from your lines</span></button>' +
          '<button type="button" class="mode-btn" id="h-drill"><span class="t">Drill</span><span class="d">Clean lines in a row · best ' + stats.drillBest + "</span></button>" +
          '<button type="button" class="mode-btn" id="h-time"><span class="t">Time trial</span><span class="d">60 seconds · best ' + stats.timeBest + " lines</span></button>" +
        "</div>";
        html += '<div class="reset-zone" id="h-reset"></div></div>';
        app.innerHTML = html;
        goToTop();

        app.querySelectorAll("[data-course]").forEach((b) => b.addEventListener("click", () => renderCourse(b.dataset.course)));
        const prac = app.querySelector("#h-practice");
        if (prac) prac.addEventListener("click", () => {
          const queue = dueLinesAll();
          playLineQueue(queue.map(({ course, line }) => ({ course, line, mode: "practice" })), "practice", renderHome);
        });
        app.querySelector("#h-puzzles").addEventListener("click", () => {
          const list = [...ALL_PUZZLES].sort((a, b) => {
            const sa = (puzzleProgress.get(a.key) || {}).solved > 0 ? 1 : 0;
            const sb = (puzzleProgress.get(b.key) || {}).solved > 0 ? 1 : 0;
            return sa - sb;
          });
          playPuzzles(list, renderHome);
        });
        app.querySelector("#h-drill").addEventListener("click", startDrill);
        app.querySelector("#h-time").addEventListener("click", startTime);
        renderResetZone();
      }
      function renderResetZone() {
        const zone = app.querySelector("#h-reset");
        if (!zone) return;
        if (confirmReset) {
          zone.innerHTML = '<span class="reset-confirm"><span style="color:var(--faded)">Erase all saved progress on this device?</span><button type="button" class="yes" id="rz-yes">Yes, reset</button><button type="button" class="keep" id="rz-keep">Keep it</button></span>';
          zone.querySelector("#rz-yes").addEventListener("click", () => {
            lineProgress.clear(); puzzleProgress.clear(); deletedSet.clear(); archivedSet.clear();
            stats.drillBest = 0; stats.timeBest = 0; confirmReset = false; clearStoredProgress(); renderHome();
          });
          zone.querySelector("#rz-keep").addEventListener("click", () => { confirmReset = false; renderResetZone(); });
        } else {
          zone.innerHTML = '<p style="margin:0 0 0.5rem;font-size:13px;color:var(--faded);line-height:1.5">Your progress is saved on this device and survives closing the app. Resetting erases the saved copy here.</p><button type="button" class="reset-link" id="rz-open">Reset all progress</button>';
          zone.querySelector("#rz-open").addEventListener("click", () => { confirmReset = true; renderResetZone(); });
        }
      }

      /* ---- Swipeable line row ---- */
      const SWIPE_W = 168;
      function attachSwipe(rowEl, opts) {
        // opts: {open, onOpenChange, onTap}
        let liveOffset = null;
        let drag = null;
        let suppressClick = false;
        const base = () => (opts.open ? -SWIPE_W : 0);
        function paint() {
          const shown = liveOffset !== null ? liveOffset : base();
          rowEl.style.transform = "translateX(" + shown + "px)";
          rowEl.style.transition = liveOffset === null ? "transform 200ms ease" : "none";
        }
        paint();
        rowEl.addEventListener("pointerdown", (e) => {
          drag = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, base: base(), decided: false, active: false };
        });
        rowEl.addEventListener("pointermove", (e) => {
          if (!drag || e.pointerId !== drag.pointerId) return;
          const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
          if (!drag.decided) {
            if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
            drag.decided = true;
            drag.active = Math.abs(dx) > Math.abs(dy);
            if (drag.active) { try { rowEl.setPointerCapture(e.pointerId); } catch (err) {} }
          }
          if (drag.active) {
            liveOffset = Math.max(-SWIPE_W, Math.min(0, drag.base + dx));
            paint();
          }
        });
        function endDrag(cancelled) {
          if (!drag) return;
          const wasActive = drag.active;
          drag = null;
          if (wasActive) {
            suppressClick = true;
            if (!cancelled && liveOffset !== null) opts.onOpenChange(liveOffset < -SWIPE_W / 2);
          }
          liveOffset = null;
          paint();
        }
        rowEl.addEventListener("pointerup", () => endDrag(false));
        rowEl.addEventListener("pointercancel", () => endDrag(true));
        rowEl.addEventListener("click", (e) => {
          if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
          if (opts.open) { e.preventDefault(); e.stopPropagation(); opts.onOpenChange(false); return; }
          if (opts.onTap) opts.onTap();
        }, true);
        rowEl.addEventListener("keydown", (e) => {
          if (opts.onTap && !opts.open && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); opts.onTap(); }
        });
        return { paint };
      }

      function renderCourse(courseId, keepScroll) {
        stopSession();
        const full = courseById(courseId);
        const visible = visibleCourses().find((c) => c.id === courseId) || { ...full, lines: [] };
        const course = visible;
        const deletedLines = full.lines.filter((l) => deletedSet.has(l.id));
        const archivedLines = full.lines.filter((l) => archivedSet.has(l.id));
        const now = Date.now();
        const newLines = course.lines.filter((l) => (lineProgress.get(l.id) || {}).status !== "learned");
        const dueLines = course.lines.filter((l) => { const r = lineProgress.get(l.id); return r && r.status === "learned" && r.dueAt <= now; })
          .sort((a, b) => (lineProgress.get(a.id).dueAt || 0) - (lineProgress.get(b.id).dueAt || 0));
        const trainItems = [
          ...newLines.map((line) => ({ course: full, line, mode: "learn" })),
          ...dueLines.map((line) => ({ course: full, line, mode: "practice" }))
        ];
        const reviewItems = shuffle(course.lines).map((line) => ({ course: full, line, mode: "practice" }));
        let openSwipeId = null;
        const rowPainters = {};

        let html = '<div class="wrap fade-in" style="padding-top:1rem;padding-bottom:2.5rem">';
        html += '<button type="button" class="back-btn" id="c-back" aria-label="Back to all courses"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2 L4 8 L10 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>All courses</button>';
        html += '<h1 class="course-h">' + esc(full.name) + '</h1><p class="course-sub">' + esc(full.source) + " · you play " + (full.color === "white" ? "White" : "Black") + "</p>";
        const videos = COURSE_VIDEOS[full.id] || [];
        if (videos.length) {
          html += '<p class="video-links">' + videos.map((v) =>
            '<a class="video-link" href="' + esc(v.url) + '" target="_blank" rel="noopener noreferrer">' +
            '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.5 L10.5 6 L2.5 10.5 Z" fill="currentColor"/></svg>' +
            esc(v.label) + "</a>"
          ).join("") + "</p>";
        }
        if (archivedLines.length + deletedLines.length > 0) {
          html += '<p class="course-account">' + (course.lines.length + archivedLines.length + deletedLines.length) + " lines in this course in all: " + course.lines.length + " in training" +
            (archivedLines.length ? ", " + archivedLines.length + " archived" : "") +
            (deletedLines.length ? ", " + deletedLines.length + " deleted" : "") +
            ". The archived and deleted ones are listed below.</p>";
        }
        if (course.lines.length === 0) {
          html += '<div class="panel-card notice"><p>No lines from this course are in training.</p><p class="sub">Unarchive a line or restore a deleted one below to bring it back.</p></div>';
        } else if (trainItems.length > 0) {
          const bits = [];
          if (newLines.length) bits.push(newLines.length + " new line" + (newLines.length === 1 ? "" : "s") + " to learn");
          if (dueLines.length) bits.push(dueLines.length + " due for review");
          html += '<button type="button" class="cta" id="c-train"><span class="cta-big">' + (newLines.length ? "Train this course" : "Review due lines") + '</span><span class="cta-small">' + esc(bits.join(" · ")) + ". The trainer picks the order; you just play.</span></button>";
        } else {
          html += '<div class="panel-card notice"><p>Every line is learned and nothing is due.</p><p class="sub">You can still run the whole course: a shuffled pass over every line, trainer\u2019s choice.</p><button type="button" class="primary-btn" id="c-review">Review the whole course</button></div>';
        }

        html += '<h2 class="sub-h">Where each line stands</h2>';
        if (course.lines.length > 0) html += '<p class="sub-note">Tap a line to train just that line. Swipe it left to archive or delete it.</p>';
        if (course.lines.length === 0) html += '<p class="sub-note" style="margin-top:0.5rem">No lines left in this course.</p>';
        else {
          html += '<div class="line-list">';
          for (const line of course.lines) {
            const row = lineProgress.get(line.id);
            const learned = row && row.status === "learned";
            const due = learned && row.dueAt <= now;
            html += '<div class="swipe-wrap"><div class="swipe-actions">' +
              '<button type="button" class="arch" data-arch="' + line.id + '" aria-label="Archive line ' + esc(line.chapter) + '">Archive</button>' +
              '<button type="button" class="del" data-del="' + line.id + '" aria-label="Delete line ' + esc(line.chapter) + '">Delete</button></div>' +
              '<div class="line-row" role="button" tabindex="0" data-line="' + line.id + '" aria-label="Train line ' + esc(line.chapter) + '">' +
                '<div class="main"><p class="chap">' + esc(line.chapter) + '</p><p class="stat">' + (learned ? (due ? "Due now" : esc(dueLabel(row.dueAt, now))) : "Not learned yet") + "</p></div>" +
                '<span class="badge ' + (!learned ? "new" : due ? "due" : "learned") + '">' + (!learned ? "New" : due ? "Due" : "Learned") + "</span>" +
                '<svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true" style="flex-shrink:0;color:var(--faded)"><path d="M1 1 L9 6 L1 11 Z" fill="currentColor"/></svg>' +
              "</div></div>";
          }
          html += "</div>";
        }

        if (deletedLines.length) {
          html += '<h2 class="sub-h">Deleted lines</h2><p class="sub-note">Deleted lines are out of training. Restore one to learn it again from the start.</p><div class="line-list">';
          for (const line of deletedLines) {
            html += '<div class="plain-row"><div class="main"><p class="chap">' + esc(line.chapter) + '</p></div><button type="button" class="small-btn" data-restore="' + line.id + '" aria-label="Restore line ' + esc(line.chapter) + '">Restore</button></div>';
          }
          html += "</div>";
        }
        if (archivedLines.length) {
          html += '<h2 class="sub-h">Archived lines</h2><p class="sub-note">Archived lines are out of training, but their progress is kept. Unarchive one to pick it back up where you left off.</p><div class="line-list">';
          for (const line of archivedLines) {
            const row = lineProgress.get(line.id);
            const learned = row && row.status === "learned";
            html += '<div class="plain-row"><div class="main"><p class="chap">' + esc(line.chapter) + '</p><p class="stat">' + (learned ? esc(dueLabel(row.dueAt, now)) : "Not learned yet") + '</p></div><button type="button" class="small-btn" data-unarch="' + line.id + '" aria-label="Unarchive line ' + esc(line.chapter) + '">Unarchive</button></div>';
          }
          html += "</div>";
        }

        if (full.puzzles.length) {
        html += '<h2 class="sub-h">Tactics from this course</h2>' +
          '<button type="button" class="tactics-btn" id="c-tactics"><span class="t">Train tactics</span><span class="d">All ' + full.puzzles.length + ' tactics from these lines, unsolved ones first.</span></button><div class="line-list">';
        for (const puzzle of full.puzzles) {
          const row = puzzleProgress.get(puzzle.key);
          const solved = row && row.solved > 0;
          const stat = solved ? "Solved" : row && row.attempts > 0 ? "Tried " + row.attempts + " time" + (row.attempts === 1 ? "" : "s") + ", not solved yet" : "Not solved yet";
          html += '<div class="plain-row" style="opacity:1"><div class="main"><p class="chap">' + esc(puzzle.chapter) + '</p><p class="stat">' + stat + '</p></div><span class="badge ' + (solved ? "learned" : "new") + '" style="font-size:13px;font-weight:700;color:' + (solved ? "var(--good)" : "var(--faded)") + '">' + (solved ? "Solved" : "Waiting") + "</span></div>";
        }
        html += "</div>";
        }
        html += "</div>";
        app.innerHTML = html;
        // Arriving at a course page starts at the top; re-rendering the same
        // page in place (archive / delete / restore) keeps the scroll spot.
        if (!keepScroll) goToTop();

        app.querySelector("#c-back").addEventListener("click", renderHome);
        const trainBtn = app.querySelector("#c-train");
        if (trainBtn) trainBtn.addEventListener("click", () => playLineQueue(trainItems, "course", () => renderCourse(courseId)));
        const reviewBtn = app.querySelector("#c-review");
        if (reviewBtn) reviewBtn.addEventListener("click", () => playLineQueue(reviewItems, "course", () => renderCourse(courseId)));
        const tacticsBtn = app.querySelector("#c-tactics");
        if (tacticsBtn) tacticsBtn.addEventListener("click", () => {
          const queue = [...full.puzzles].sort((a, b) => {
            const sa = (puzzleProgress.get(a.key) || {}).solved > 0 ? 1 : 0;
            const sb = (puzzleProgress.get(b.key) || {}).solved > 0 ? 1 : 0;
            return sa - sb;
          });
          playPuzzles(queue, () => renderCourse(courseId));
        });
        app.querySelectorAll("[data-restore]").forEach((b) => b.addEventListener("click", () => { deletedSet.delete(b.dataset.restore); saveProgress(); renderCourse(courseId, true); }));
        app.querySelectorAll("[data-unarch]").forEach((b) => b.addEventListener("click", () => { archivedSet.delete(b.dataset.unarch); saveProgress(); renderCourse(courseId, true); }));
        app.querySelectorAll("[data-line]").forEach((rowEl) => {
          const lineId = rowEl.dataset.line;
          const line = course.lines.find((l) => l.id === lineId);
          const wrap = rowEl.closest(".swipe-wrap");
          const archBtn = wrap.querySelector("[data-arch]");
          const delBtn = wrap.querySelector("[data-del]");
          const painter = attachSwipe(rowEl, {
            get open() { return openSwipeId === lineId; },
            onOpenChange(open) {
              openSwipeId = open ? lineId : null;
              for (const k in rowPainters) rowPainters[k].paint();
              archBtn.tabIndex = openSwipeId === lineId ? 0 : -1;
              delBtn.tabIndex = openSwipeId === lineId ? 0 : -1;
            },
            onTap() {

      function renderSummary(title, body, onClose) {
        stopSession();
        app.innerHTML = '<div class="summary fade-in"><h2>' + esc(title) + '</h2><p>' + esc(body) + '</p><button type="button" class="next-btn" id="sum-close">Back to your repertoires</button></div>';
        goToTop();
        app.querySelector("#sum-close").addEventListener("click", onClose);
      }

      /* ---- Runs ---- */
      function playLineQueue(items, kind, onClose) {
        // kind: "course" | "practice" — summary wording differs slightly
        let index = 0, doneCount = 0, cleanCount = 0, newCount = 0;
        function step() {
          const item = items[index];
          if (!item) {
            if (kind === "practice") renderSummary("Practice done", cleanCount + " of " + items.length + " lines played clean. The rest come back sooner; the clean ones, later.", onClose);
            else renderSummary("Training done", "You worked through " + doneCount + " of " + items.length + " lines: " + newCount + " new, " + cleanCount + " played clean start to finish. Anything shaky comes back sooner.", onClose);
            return;
          }
          const last = index === items.length - 1;
          const advance = () => { index += 1; step(); };
          mountSession(app, {
            quiz: lineQuiz(item.course, item.line),
            mode: item.mode,
            headerExtraHTML: () => ({ html: (kind === "practice" ? (index + 1) + " of " + items.length : "Line " + (index + 1) + " of " + items.length) }),
            finishLabel: () => (last ? "Finish" : "Next line"),
            onComplete(result) {
              recordLineResult(item.line.id, item.course.id, item.mode, result.mistakes, result.hints);
              doneCount += 1;
              if (item.mode === "learn") newCount += 1;
              if (result.mistakes === 0 && result.hints === 0) cleanCount += 1;
            },
            onExit: advance,
            onQuit: onClose,
            onArchive() { archivedSet.add(item.line.id); deletedSet.delete(item.line.id); saveProgress(); advance(); },
            onDelete() { deletedSet.add(item.line.id); archivedSet.delete(item.line.id); lineProgress.delete(item.line.id); saveProgress(); advance(); }
          });
        }
        if (!items.length) { onClose(); return; }
        step();
      }

      function playPuzzles(list, onClose) {
        let index = 0, solvedCount = 0;
        function step() {
          const puzzle = list[index];
          if (!puzzle) {
            renderSummary("Puzzles done", "You solved " + solvedCount + " of " + list.length + ". Every one of these tactics comes from a line in your own repertoire.", onClose);
            return;
          }
          const last = index === list.length - 1;
          mountSession(app, {
            quiz: puzzleQuiz(puzzle),
            mode: "puzzle",
            headerExtraHTML: () => ({ html: (index + 1) + " of " + list.length }),
            finishLabel: () => (last ? "Finish" : "Next puzzle"),
            onComplete(result) {
              recordPuzzleResult(puzzle, result.completed, result.mistakes === 0 && result.hints === 0);
              if (result.completed) solvedCount += 1;
            },
            onExit() { index += 1; step(); },
            onQuit: onClose
          });
        }
        if (!list.length) { onClose(); return; }
        step();
      }

      function startDrill() {
        const vc = visibleCourses();
        const all = vc.flatMap((course) => course.lines.map((line) => ({ course, line })));
        if (!all.length) { renderSummary("No lines to drill", "Every line has been deleted or archived. Bring one back from its course page to train again.", renderHome); return; }
        const learned = all.filter(({ line }) => (lineProgress.get(line.id) || {}).status === "learned");
        let queue = shuffle(learned.length ? learned : all);
        let index = 0, streak = 0, lastClean = true, over = false;
        function endRun() {
          over = true;
          renderSummary("Streak: " + streak, streak > stats.drillBest ? "A new best. The lines are sticking." : "Your best is " + stats.drillBest + ". One wrong move or hint ends the run, so a streak means real recall.", renderHome);
        }
        function step() {
          if (over || !queue.length) { if (!over) endRun(); return; }
          const pos = index % queue.length;
          const item = queue[pos];
          const quiz = lineQuiz(item.course, item.line);
          mountSession(app, {
            quiz, mode: "drill",
            headerExtraHTML: () => ({ html: "Streak " + streak, cls: "strong" }),
            finishLabel: () => (lastClean ? "Next line" : "End run"),
            onComplete(result) {
              recordLineResult(item.line.id, item.course.id, "drill", result.mistakes, result.hints);
              lastClean = result.mistakes === 0 && result.hints === 0;
              if (lastClean) { streak += 1; stats.drillBest = Math.max(stats.drillBest, streak); saveProgress(); }
            },
            onExit() { if (!lastClean) endRun(); else { index += 1; step(); } },
            onQuit: renderHome,
            onArchive() { archivedSet.add(item.line.id); deletedSet.delete(item.line.id); saveProgress(); removeCurrent(item); },
            onDelete() { deletedSet.add(item.line.id); archivedSet.delete(item.line.id); lineProgress.delete(item.line.id); saveProgress(); removeCurrent(item); }
          });
          function removeCurrent(it) {
            queue = queue.filter((q) => q.line.id !== it.line.id);
            lastClean = true;
            if (!queue.length) endRun();
            else { index = pos >= queue.length ? 0 : pos; step(); }
          }
        }
        step();
      }

      function startTime() {
        const vc = visibleCourses();
        const all = vc.flatMap((course) => course.lines.map((line) => ({ course, line })));
        if (!all.length) { renderSummary("No lines for a time trial", "Every line has been deleted or archived. Bring one back from its course page to train again.", renderHome); return; }
        let queue = shuffle(all);
        let index = 0, score = 0, timeLeft = 60, over = false;
        let handle = null;
        const ticker = setInterval(() => {
          if (over) { clearInterval(ticker); return; }
          timeLeft = Math.max(0, timeLeft - 0.25);
          const extra = app.querySelector("#s-extra");
          if (extra) {
            extra.textContent = Math.ceil(timeLeft) + "s";
            extra.className = "head-extra strong" + (timeLeft <= 10 ? " danger" : "");
            extra.style.fontSize = "0.875rem";
          }
          if (timeLeft <= 0) endRun();
        }, 250);
        function endRun() {
          if (over) return;
          over = true;
          clearInterval(ticker);
          if (handle) handle.cleanup();
          renderSummary(score + " clean line" + (score === 1 ? "" : "s"),
            score > stats.timeBest ? "A new best for the 60-second trial. Every clean line won back 4 seconds." : "Your best is " + stats.timeBest + ". Clean lines win back 4 seconds each; a line with a mistake just costs the time it took.",
            renderHome);
        }
        function step() {
          if (over || !queue.length) { if (!over) endRun(); return; }
          const pos = index % queue.length;
          const item = queue[pos];
          handle = mountSession(app, {
            quiz: lineQuiz(item.course, item.line), mode: "time",
            headerExtraHTML: () => ({ html: Math.ceil(timeLeft) + "s", cls: "strong" + (timeLeft <= 10 ? " danger" : "") }),
            finishLabel: () => "Next line",
            onComplete(result) {
              recordLineResult(item.line.id, item.course.id, "time", result.mistakes, result.hints);
              if (result.mistakes === 0 && result.hints === 0) {
                score += 1; timeLeft += 4; stats.timeBest = Math.max(stats.timeBest, score); saveProgress();
              }
            },
            onExit() { index += 1; step(); },
            onQuit() { over = true; clearInterval(ticker); renderHome(); },
            onArchive() { archivedSet.add(item.line.id); deletedSet.delete(item.line.id); saveProgress(); removeCurrent(item, pos); },
            onDelete() { deletedSet.add(item.line.id); archivedSet.delete(item.line.id); lineProgress.delete(item.line.id); saveProgress(); removeCurrent(item, pos); }
          });
        }
        function removeCurrent(it, pos) {
          queue = queue.filter((q) => q.line.id !== it.line.id);
          if (!queue.length) endRun();
          else { index = pos >= queue.length ? 0 : pos; step(); }
        }
        step();
      }

        .then((raw) => {
          COURSES = raw.courses.map((c) => ({
            id: c.id, name: c.name, color: c.color === "white" ? "white" : "black", source: c.source, chapters: c.chapters,
            lines: c.lines.filter((l) => isPlayableLine(l.moves)),
            puzzles: c.puzzles.map((p, i) => ({ key: c.id + "-pz-" + i, courseId: c.id, fen: p.fen, solutionSan: p.solution_san, chapter: p.chapter, note: p.note, sequence: p.sequence }))
          }));
          ALL_PUZZLES = COURSES.flatMap((c) => c.puzzles);
          // Prune any saved entries for lines/puzzles that no longer exist.
          {
            const validLines = new Set(COURSES.flatMap((c) => c.lines.map((l) => l.id)));
            const validPuzzles = new Set(ALL_PUZZLES.map((p) => p.key));
            let pruned = false;
            for (const id of Array.from(lineProgress.keys())) if (!validLines.has(id)) { lineProgress.delete(id); pruned = true; }
            for (const key of Array.from(puzzleProgress.keys())) if (!validPuzzles.has(key)) { puzzleProgress.delete(key); pruned = true; }
            for (const id of Array.from(archivedSet)) if (!validLines.has(id)) { archivedSet.delete(id); pruned = true; }
            for (const id of Array.from(deletedSet)) if (!validLines.has(id)) { deletedSet.delete(id); pruned = true; }
            if (pruned) saveProgress();
          }
          renderHome();
        })
        .catch(() => {
          app.innerHTML = '<div class="loading"><p style="color:var(--parchment)">Your courses could not be loaded.</p><button type="button" class="next-btn" style="width:auto;display:inline-flex;min-height:2.75rem;padding:0.625rem 1.5rem;font-size:1rem" onclick="location.reload()">Try again</button></div>';
